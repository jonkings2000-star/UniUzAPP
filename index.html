<!DOCTYPE html>
<html lang="ru">
<head>

<title>UniUZ</title>
<link rel="stylesheet" href="style.css">

<div id="loading"><div class="loading-spinner"></div></div>

<main id="screen"></main>

<nav class="bottom-nav">
